# Full age-filtered cohort — Borzoi-CH (parity with AlphaGenome full run).
project_dir: .

data:
  fasta_path: ../sm_ch_finetune/data/reference/hg38.fa
  split_dir: ../sm_ch_finetune/data/processed_age_filtered
  seed: 42

model:
  checkpoint_path: null
  window_size: 65536
  head_hidden_dim: 256

training:
  batch_size: 8
  grad_accum_steps: 1
  eval_batch_size: 8
  num_epochs: 5
  learning_rate: 0.0008
  weight_decay: 0.01
  early_stopping_patience: 3
  log_every_steps: 100
  max_train_steps: null

checkpoint_dir: checkpoints/full_age_filtered_64kb_bs8_5ep
results_dir: results

export:
  prefix: borzoi_full
  include_valid: true
  train_predictions: results/borzoi_full_train_predictions.parquet
  valid_predictions: results/borzoi_full_valid_predictions.parquet
  test_predictions: results/borzoi_full_test_predictions.parquet

metrics_file: results/borzoi_full_test_metrics.json
