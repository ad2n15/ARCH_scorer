# Full age-filtered cohort — NTv3-CH (parity with AlphaGenome full_age_filtered_nocds_64kb_bs8_5ep.yaml).
# train≈335156 | valid≈18620 | test≈18620 | CH rate ~23%
project_dir: .

data:
  fasta_path: ../sm_ch_finetune/data/reference/hg38.fa
  split_dir: ../sm_ch_finetune/data/processed_age_filtered
  seed: 42

model:
  hf_model: InstaDeepAI/NTv3_650M_post
  species: human
  window_size: 65536
  head_hidden_dim: 256

training:
  batch_size: 8
  grad_accum_steps: 1
  eval_batch_size: 8
  num_epochs: 5
  learning_rate: 0.0008
  weight_decay: 0.01
  early_stopping_patience: 3
  log_every_steps: 100
  max_train_steps: null

checkpoint_dir: checkpoints/full_age_filtered_64kb_bs8_5ep
results_dir: results

export:
  prefix: ntv3_full
  include_valid: true
  train_predictions: results/ntv3_full_train_predictions.parquet
  valid_predictions: results/ntv3_full_valid_predictions.parquet
  test_predictions: results/ntv3_full_test_predictions.parquet

metrics_file: results/ntv3_full_test_metrics.json
